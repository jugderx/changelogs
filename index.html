<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Changelogs</title>
<style>
:root{--bg:#14161d;--card:#1e222c;--line:#323848;--tx:#e9ecf3;--mut:#9aa3b5;--acc:#f5b323}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 system-ui,sans-serif}
.wrap{display:flex;min-height:100vh}
nav{flex:0 0 250px;background:#10121a;border-right:1px solid var(--line);padding:20px 12px;position:sticky;top:0;height:100vh;overflow-y:auto}
nav h4{margin:0 0 14px;font-size:1.1rem;letter-spacing:.1em;text-transform:uppercase;color:var(--acc)}
.nb{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:10px;color:var(--tx);padding:10px 12px;margin-bottom:8px;cursor:pointer;font:inherit}
.nb:hover{border-color:#4a536b}.nb.on{border-color:var(--acc);background:#2a2618}
.nb b{display:block;color:var(--acc)}.nb span{display:block;font-size:.82rem;color:var(--mut)}.nb i{display:block;font-style:normal;font-size:.88rem;margin-top:2px}
main{flex:1;min-width:0;max-width:860px;margin:0 auto;padding:28px 16px 60px}
@media(max-width:700px){.wrap{flex-direction:column}nav{position:static;height:auto;flex:none;display:flex;gap:8px;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line)}nav h4{display:none}.nb{min-width:150px;margin:0}}
h1{font-size:2rem;line-height:1.2;margin:0 0 6px}.ver{color:var(--mut);margin:0 0 22px}.patch{margin-bottom:56px;padding-bottom:10px;border-bottom:2px solid var(--line)}.patch:last-child{border:0}
h2{font-size:1rem;letter-spacing:.08em;text-transform:uppercase;border-left:4px solid var(--acc);padding-left:10px;margin:34px 0 14px}
.e{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:14px}
.e h3{margin:0 0 6px;color:var(--acc);font-size:1.15rem}.e p{margin:0 0 8px}
ul{margin:8px 0;padding-left:20px}li{margin:5px 0}
.it{display:flex;gap:12px;align-items:flex-start;margin-top:10px;padding:10px;background:#171a22;border-radius:10px}
.ic{flex:0 0 56px;width:56px;height:56px;border-radius:10px;background:#2a3040;object-fit:contain;display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--mut)}
.it b{display:block}.it span{color:var(--mut);font-size:.93rem}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.tag{display:flex;gap:8px;align-items:center;background:#171a22;border-radius:22px;padding:3px 14px 3px 4px;font-size:.9rem}
.tag .ic{flex:0 0 32px;width:32px;height:32px;border-radius:50%;font-size:.7rem}
</style></head><body><div class="wrap"><nav id="nav"><h4>Changelogs</h4></nav><main><div id="app"></div></main></div>

["Главное",[
{t:"Kurogane присоединяется к The Reckoning",x:"The Reckoning теперь меняет босса каждую субботу, а его карточка и экран меняются вместе с боссом. На этой неделе его место занимает Kurogane, последний сёгун, а дальше он и Tide Sovereign будут сменять друг друга.",
b:["Его неделя проходит в горящем замке под кровавой луной, против его собственной армии мёртвых самураев: пехотинцев, бронированных стражей и быстрых ниндзя.","Рядом с ними сражаются три новых элитных врага. Лучник целится туда, куда вы идёте, военный барабанщик бьёт по полу вокруг себя в том порядке, в котором показал это заранее, а круг мечника рубит каждого, кто всё ещё движется внутри него, когда он убирает меч в ножны.","Победите его, и у вас будет шанс получить его эксклюзивное оружие — Kurogane's Nodachi. Если оно выпадает, в конце боя Kurogane теряет свой меч, а игрок, выигравший его, подбирает его и добивает босса в катсцене.","Insane — самый сложный способ сразиться с боссом Reckoning, поэтому теперь он платит больше. Эксклюзивное оружие обоих боссов выпадает с шансом 2,5% на Insane (раньше 1,75%). На Easy, Medium и Hard шансы не изменились: 1%, 1,25% и 1,5%.","Новый босс больше не начинается с Easy. Лучшая сложность, которую вы прошли на любом боссе Reckoning, открыта на каждом из них, вплоть до Hard. Insane по-прежнему нужно заслужить, победив этого босса на Hard."],
i:[["KuroganesNodachi","Один гигантский удар замораживает каждого врага, которого он рассекает, затем меч возвращается в ножны, и шквал ударов рвёт их на куски."]]},
{t:"Семь новых эволюций классов",x:"Каждый класс получает новую эволюцию, а Warrior — сразу две. Каждая использует как минимум одно оружие своего класса, поэтому создать её может только этот класс. Прокачайте оба оружия до максимума за один забег, и эволюция появится в вашем драфте.",
i:[["BallLightning","Mage. Шаровая молния на привязи хлещет врагов, пока вы бежите, и бьёт током всё вокруг. Взмахи заряжают её, а полный заряд перегружает: взрыв вокруг шара, а затем 4 секунды гораздо более частых разрядов."],
["Starbreaker","Warrior. Падающие звёзды вонзают кристальные осколки во врагов, в которых попадают, а каждый удар кулаком раскалывает осколки во врагах, по которым пришёлся. Босс получает осколки от каждой звезды, поэтому получает самые большие удары."],
["Rockfall","Warrior. Гигантский молот бьёт по земле, и неподалёку от места удара с неба падает валун. Подойдите к валуну, и следующий взмах отшвырнёт его от вас сквозь толпу, а в конце он взорвётся. Валун, который вы не трогаете, рассыпается через 7 секунд."],
["ChainReaction","Ranger. Вы оставляете за собой след из пузырьковых мин. Болт арбалета поджигает след, и взрывы бегут по нему до самого конца: каждый пузырь лопается шрапнелью и иглой."],
["Backstabber","Rogue. Каждый враг в пределах 16 стадов от вас помечается. Бритвы летят во врагов в спину, всегда наносят крит, вызывают кровотечение и отскакивают к следующему помеченному врагу."],
["SeraphsCenser","Healer. Крылатая кадильница опутывает ближайших врагов цепями света, которые бьют сильнее, чем дольше держат, и лечат вас и союзников. Цепь лопается святым взрывом, когда достигает полной силы или когда её враг умирает."],
["Gunship","Engineer. Вертолёт совершает штурмовые заходы над самой большой толпой или над боссом, поливая её из миниганa и сбрасывая ракеты вдоль линии. На 6 уровне к каждому заходу присоединяется второй вертолёт."]]},
{t:"The Piledriver перестроен",x:"The Piledriver был самой слабой эволюцией в игре. Он притягивал врагов к вам, а его рейлган почти никогда не стрелял. Теперь он бьёт по земле и рассылает ударные волны.",
b:["Каждый такт кулак обрушивается на самую большую группу врагов рядом с вами и отбрасывает их от места удара.","Каждые 4 удара, достигших цели, заряжают катушку. Следующий такт вгоняет кулак в землю, и расходится ударная волна, которая бьёт каждого врага на своём пути и отбрасывает его.","Area увеличивает и удар, и ударную волну.","Новые эффекты, новые звуки и новая катушка на руке, которая светится одним кольцом за каждый заряд."],i:[["Piledriver"]]}
]],
["Баланс",[
{t:"Bladestorm",x:"Кольцо пил вращалось слишком далеко, чтобы бить врагов вплотную к вам, а брошенные пилы пролетали сбоку мимо них. Теперь и то и другое направлено туда, где находятся враги.",b:["Кольцо стало плотнее и рубит врагов вплотную к вам.","Бьёт каждая пила в кольце, а не один проход за круг, поэтому больше пил — больше урона. Чтобы это компенсировать, каждый удар наносит меньше урона.","Перед броском кольцо плотно стягивается вокруг вас, затем пилы летят прямо сквозь окружающих врагов и возвращаются.","Брошенные пилы пробивают 5 дополнительных врагов вместо 3."],i:[["Bladestorm"]]},
{t:"Equinox",x:"Equinox переключался между огненным кольцом и ледяным лучом, поэтому половина оружия всегда была выключена. Теперь работают оба, а сезон определяет, какой из них на полной силе.",b:["Летом кольцо горит на полную мощность, а луч — на 40%. Зимой наоборот.","Огненное кольцо больше на 45%.","Теперь он включается, как только враг попадает в зону луча, а не только когда враг вплотную к вам."],i:[["Equinox"]]},

{t:"Shredder",x:"Когда ганблейд убивает цель, он теперь сразу прыгает к следующему врагу, а не летит сначала обратно к вам. Урон перенесён с удара на выстрел, так что цель получает тот же урон, а каждый враг за ней — больше.",i:[["Shredder","Выстрелы, проходящие сквозь врагов, наносят на 50% больше урона."]]},
{t:"Supernova",x:"Supernova была намного слабее двух видов оружия, которыми вы жертвуете, чтобы её создать.",i:[["Supernova","Урон кольца +50%. Размер кольца и взрыва +33%. Схлопывается каждые 3 секунды вместо 4. Урон взрыва +50%."]]},

{t:"Vesuvius и The Painbow",x:"Оба стали намного сильнее других эволюций в Dungeon of Trials, в основном из-за последнего уровня, который при повышении ранга предмета считается дважды. Area по-прежнему увеличивает их урон, меньше даёт только последний уровень.",i:[["Vesuvius","Уровень 8 теперь даёт +25% урона и +10% Area, вместо +35% урона и +25% Area."],["Painbow","Уровень 8 теперь даёт +10% Area, вместо +30%."]]},

const app=document.getElementById("app");
const el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.textContent=h;return e};
const icon=id=>{const [n,src]=I[id]||[id,null];
 const ph=()=>{const d=el("div","ic",(n.match(/[A-Z]/g)||[n[0]]).slice(0,2).join(""));return d};
 if(!src)return ph();
 const im=el("img","ic");im.alt=n;im.loading="lazy";im.src=src;im.onerror=()=>im.replaceWith(ph());return im};
const nav=document.getElementById("nav");
function show(n){
 nav.querySelectorAll(".nb").forEach((b,i)=>b.classList.toggle("on",i===n));
 app.replaceChildren();const p=P[n];
 const box=el("section","patch");app.append(box);box.append(el("h1","",p.t),el("p","ver",p.v+" · "+p.d));
 for(const [name,es] of p.S){box.append(el("h2","",name));
  for(const e of es){const d=el("div","e");d.append(el("h3","",e.t),el("p","",e.x));
   if(e.b){const u=el("ul");e.b.forEach(b=>u.append(el("li","",b)));d.append(u)}
   if(e.i){
    if(e.i.some(x=>x[1]))e.i.forEach(([id,tx])=>{const r=el("div","it");const bx=el("div");bx.append(el("b","",I[id][0]));if(tx)bx.append(el("span","",tx));r.append(icon(id),bx);d.append(r)});
    else{const g=el("div","tags");e.i.forEach(([id])=>{const t=el("div","tag");t.append(icon(id),el("span","",I[id][0]));g.append(t)});d.append(g)}}
   box.append(d)}}
 scrollTo(0,0);
}
P.forEach((p,i)=>{const b=el("button","nb");b.append(el("b","",p.v),el("i","",p.t),el("span","",p.d));b.onclick=()=>show(i);nav.append(b)});
show(0);
